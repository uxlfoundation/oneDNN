name: "PR Linters"

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Declare default permissions as read only.
permissions: read-all

# Kill stale checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pr-commits:
    name: Commit Messages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit messages
        run: python3 ./.github/automation/commit-msg-check.py "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.base.sha }}"

  pr-header-guards:
    name: Header Guards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check header guards
        run: ./scripts/fix_header_guards.py -v $(git diff --name-only "${{ github.event.pull_request.base.sha }}")

  pr-clang-format:
    name: Clang-Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt update && sudo apt install -y "clang-format-18"
      - name: Check code formatting
        run: .github/automation/clang-format.sh ${{ github.event.pull_request.base.sha }}

  pr-format-tags:
    name: Format Tags Consistency
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout oneDNN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libomp-dev

      - name: Install castxml package
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --no-cache-dir --disable-pip-version-check castxml

      - name: Configure oneDNN
        run: .github/automation/x64/build_linters.sh
        working-directory: ${{ github.workspace }}/source
        env:
          ONEDNN_ACTION: configure

      - name: Check format-tags
        run: |
          venv/bin/castxml --castxml-cc-gnu-c clang --castxml-output=1 -I${{ github.workspace }}/source/include -I${{ github.workspace }}/build/include ${{ github.workspace }}/source/include/oneapi/dnnl/dnnl_types.h -o ${{ github.workspace }}/types.xml
          python ${{ github.workspace }}/source/scripts/generate_dnnl_debug.py ${{ github.workspace }}/types.xml
          python ${{ github.workspace }}/source/scripts/generate_format_tags.py
          cd ${{ github.workspace }}/source/
          git diff | grep . && exit 1 || true
 
  pr-check-license-header:
    name: Copyright Check
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Run check"
        uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0
        with:
          config: ".github/.licenserc.yml"
          mode: "check"

  pr-python-linter:
    name: Python Linter
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Python linting
        uses: oxsecurity/megalinter/flavors/python@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        id: pyl
        env:
          VALIDATE_ALL_CODEBASE: true
          MEGALINTER_CONFIG: .github/python-linting.yml

  pr-clang-tidy:
    strategy:
      fail-fast: false
      matrix:
        config: [
          { arch: AArch64, compiler: clang, label: ubuntu-24.04-arm},
          { arch: x64, compiler: clang, label: ubuntu-24.04},
          { arch: x64, compiler: DPC++, label: ubuntu-24.04},
        ]

    name: Clang-Tidy - ${{matrix.config.arch}} (${{matrix.config.compiler}})
    runs-on: ${{matrix.config.label}}
    steps:
      - name: Checkout oneDNN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: oneDNN
          fetch-depth: 0

      # Skips the checks if no C/C++ sources are changed.
      - name: Check for changed C/C++ sources
        id: sources
        working-directory: ${{github.workspace}}/oneDNN
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} | grep -q -E '\.c(pp|xx)?$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No source files to check."
          fi

      - if: ${{ steps.sources.outputs.changed == 'true' && matrix.config.compiler == 'clang' }}
        name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libomp-dev ocl-icd-libopencl1 ocl-icd-opencl-dev clang-tidy

      - if: ${{ steps.sources.outputs.changed == 'true' && matrix.config.compiler == 'DPC++' }}
        name: Install DPC++
        run: |
          sudo apt update
          sudo apt install -y gpg-agent wget
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
              | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
              | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt update
          sudo apt install intel-oneapi-compiler-dpcpp-cpp intel-oneapi-tbb-devel

      # This needs to run on all platforms even if it is not used, as
      # expressions in env of skipped steps are still evaluated.
      - name: Read ci.json versions file
        id: get-versions
        run: |
          content=`cat ${{ github.workspace }}/oneDNN/.github/automation/aarch64/ci.json`
          content="${content//[$'\t\r\n$ ']}"
          echo "output=$content" >> $GITHUB_OUTPUT

      - if: ${{ steps.sources.outputs.changed == 'true' && matrix.config.arch == 'AArch64' }}
        name: Clone ACL
        run: ${{ github.workspace }}/oneDNN/.github/automation/aarch64/build_acl.sh
        env:
          ACL_ACTION: clone
          ACL_ROOT_DIR: ${{ github.workspace }}/ComputeLibrary
          ACL_VERSION: ${{ fromJson(steps.get-versions.outputs.output).dependencies.acl }}

      # We can avoid having to actually build ComputeLibrary by faking the files
      # that cmake/FindACL.cmake and cmake/ACL.cmake expect to see.
      - if: ${{ steps.sources.outputs.changed == 'true' && matrix.config.arch == 'AArch64' }}
        name: Fake ACL Build
        working-directory: ${{ github.workspace }}/ComputeLibrary/
        env:
          ACL_VERSION: ${{ fromJson(steps.get-versions.outputs.output).dependencies.acl }}
        run: |
          mkdir ./build
          echo "arm_compute_version=${ACL_VERSION}" > ./build/arm_compute_version.embed
          touch ./build/libarm_compute.so
          touch ./build/libarm_compute_graph.so
          # Delete this since clang-tidy seems to get confused and read this
          # external config
          rm .clang-tidy

      - if: ${{ steps.sources.outputs.changed == 'true' && matrix.config.arch == 'x64' }}
        name: Configure oneDNN - x64
        working-directory: ${{github.workspace}}/oneDNN
        run: .github/automation/x64/build_linters.sh
        env:
          BUILD_TOOLSET: ${{matrix.config.compiler}}
          ONEDNN_ACTION: configure

      - if: ${{ steps.sources.outputs.changed == 'true' && matrix.config.arch == 'AArch64' }}
        name: Configure oneDNN - AArch64
        working-directory: ${{github.workspace}}/oneDNN
        run: .github/automation/aarch64/build.sh
        env:
          BUILD_TOOLSET: ${{matrix.config.compiler}}
          ACL_ROOT_DIR: ${{github.workspace}}/ComputeLibrary
          ONEDNN_ACTION: configure

      - if: ${{ steps.sources.outputs.changed == 'true' }}
        name: Check source files
        working-directory: ${{github.workspace}}/oneDNN
        shell: bash
        run: |
          set +e
          if [[ "${{matrix.config.compiler}}" == "DPC++" ]]; then
            . /opt/intel/oneapi/setvars.sh
            export PATH=$(dirname $(which icx))/compiler:$PATH
          fi
          echo -e "Checking Clang-Tidy $(clang-tidy --version)\n"
          touch clang-tidy.log
          analysis_list="$(git diff --name-only ${{ github.event.pull_request.base.sha }} | grep -E '\.c(pp|xx)?$')"
          if [[ -z "$analysis_list" ]]; then
            echo "No source files to check."
            exit 0
          else
            printf "File list:\n$analysis_list\n"
            run-clang-tidy -j $(nproc) -format -p ./build $analysis_list 2>&1 | tee -a clang-tidy.log
          fi
          grep -i -E "warning:|error:" clang-tidy.log | sort -u
          grep -q -i -E "warning:|error:" clang-tidy.log && exit 1 || true

  pr-status:
    name: All Linters Clean
    runs-on: ubuntu-24.04
    needs: [ pr-commits, pr-header-guards, pr-clang-format, pr-format-tags, pr-check-license-header, pr-python-linter, pr-clang-tidy ]
    # Runs when some checks fail, as a skipped job does not block merging.
    if: ${{ !cancelled() }}
    steps:
      - name: Check results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$FAILED" == "true" ]]; then
            echo "Some checks failed"
            exit 1
          fi
          echo "Success"

# Builds oneDNN binary packages for a release tag and attaches them, together
# with SHA256 checksums and build provenance attestations, to the GitHub
# release.

name: "Release Binaries"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example, v3.14)"
        required: true
        type: string
      upload:
        description: "Upload packages to the GitHub release for the tag"
        required: false
        type: boolean
        default: false

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  prepare:
    name: Prepare
    # Skip releases published in forks, but allow manual runs there.
    if: github.repository == 'uxlfoundation/oneDNN' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Uploads must run from the release tag, so that the build automation and
      # the provenance match the released sources.
      - name: Validate release tag
        id: tag
        env:
          UPLOAD: ${{ github.event_name == 'release' || inputs.upload }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Unexpected release tag format: '$RELEASE_TAG'"
            exit 1
          fi
          if [[ "$UPLOAD" == "true" && "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "::error::Upload requires running from refs/tags/$RELEASE_TAG (got $GITHUB_REF)"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check release exists
        if: github.event_name == 'release' || inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null

  # manylinux_2_28 container ensures compatibility with RHEL 8 baseline.
  linux-x64:
    name: Linux x64, ${{ matrix.config.name }}
    needs: prepare
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64:2026.11.01-2@sha256:7e41b1c7fd64dfc69703a1124b43c404382973ee06ec5d764b85c34d2221fded
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: omp, cpu_runtime: OMP, gpu_runtime: NONE, compiler: gcc }
          - { name: sycl, cpu_runtime: OMP, gpu_runtime: SYCL, compiler: icx }
    defaults:
      run:
        shell: bash
    env:
      COMPILER: ${{ matrix.config.compiler }}
      CPU_RUNTIME: ${{ matrix.config.cpu_runtime }}
      GPU_RUNTIME: ${{ matrix.config.gpu_runtime }}
      PKG_NAME: onednn-${{ needs.prepare.outputs.tag }}-${{ matrix.config.name }}-linux-x64
    steps:
      # Build scripts come from the workflow's own commit, so that older tags
      # without them can be built too.
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: .github/automation/release
          persist-credentials: false

      - name: Checkout oneDNN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          path: oneDNN
          persist-credentials: false

      - name: Install build tools
        run: pipx install ninja==1.13.2

      - name: Install Intel oneAPI DPC++/C++ Compiler
        if: matrix.config.compiler == 'icx'
        run: ci/.github/automation/release/install_dpcpp.sh

      - name: Build and test
        working-directory: oneDNN
        # The workspace is owned by a different user than the container one.
        # Mark it as safe so that CMake can record the commit hash.
        run: |
          git config --global --add safe.directory "$PWD"
          ../ci/.github/automation/release/build.sh "$GITHUB_WORKSPACE/$PKG_NAME"

      - name: Package
        run: tar -czf "$PKG_NAME.tar.gz" "$PKG_NAME"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-x64-${{ matrix.config.name }}
          path: ${{ env.PKG_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  linux-rv64:
    name: Linux RV64, omp
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      COMPILER: riscv64-gcc
      CPU_RUNTIME: OMP
      GPU_RUNTIME: NONE
      PKG_NAME: onednn-${{ needs.prepare.outputs.tag }}-omp-linux-rv64
      QEMU_CPU: rv64,v=true,zvfh=true,zvfbfwma=true,vlen=128,vext_spec=v1.0
      QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
    steps:
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: .github/automation/release
          persist-credentials: false

      - name: Checkout oneDNN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          path: oneDNN
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: riscv64

      - name: Install build tools and cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14-riscv64-linux-gnu g++-14-riscv64-linux-gnu
          pipx install ninja==1.13.2

      - name: Build and test
        working-directory: oneDNN
        run: ../ci/.github/automation/release/build.sh "$GITHUB_WORKSPACE/$PKG_NAME"

      - name: Package
        run: tar -czf "$PKG_NAME.tar.gz" "$PKG_NAME"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-rv64-omp
          path: ${{ env.PKG_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows-x64:
    name: Windows x64, ${{ matrix.config.name }}
    needs: prepare
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: omp, cpu_runtime: OMP, gpu_runtime: NONE, compiler: cl }
          - { name: sycl, cpu_runtime: OMP, gpu_runtime: SYCL, compiler: icx }
    env:
      CPU_RUNTIME: ${{ matrix.config.cpu_runtime }}
      GPU_RUNTIME: ${{ matrix.config.gpu_runtime }}
      COMPILER: ${{ matrix.config.compiler }}
      PKG_NAME: onednn-${{ needs.prepare.outputs.tag }}-${{ matrix.config.name }}-windows-x64
    steps:
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: .github/automation/release
          persist-credentials: false

      - name: Checkout oneDNN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          path: oneDNN
          persist-credentials: false

      - name: Install Intel oneAPI DPC++/C++ Compiler
        if: matrix.config.compiler == 'icx'
        shell: cmd
        run: call ci\.github\automation\release\install_dpcpp.bat

      - name: Build and test
        shell: cmd
        working-directory: oneDNN
        run: call ..\ci\.github\automation\release\build.bat "%GITHUB_WORKSPACE%\%PKG_NAME%"

      - name: Package
        shell: pwsh
        run: 7z a -tzip "$env:PKG_NAME.zip" "$env:PKG_NAME"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows-x64-${{ matrix.config.name }}
          path: ${{ env.PKG_NAME }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [prepare, linux-x64, linux-rv64, windows-x64]
    if: >-
      (github.event_name == 'release' || inputs.upload) &&
      github.ref == format('refs/tags/{0}', needs.prepare.outputs.tag)
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # upload release assets
      id-token: write # sign attestations
      attestations: write # store attestations
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          {
            echo "# oneDNN $RELEASE_TAG; build automation commit: $GITHUB_SHA"
            sha256sum onednn-*.tar.gz onednn-*.zip
          } > "onednn-$RELEASE_TAG-sha256sums.txt"
          cat "onednn-$RELEASE_TAG-sha256sums.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/onednn-*

      # Existing assets are not replaced, so that they keep matching their
      # attestations. Delete them manually to re-spin the binaries.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/onednn-* --repo "$GITHUB_REPOSITORY"

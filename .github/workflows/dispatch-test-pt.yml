name: oneDNN test_pt

# Comment a `make test_pt` command on a PR to run the torch-xpu-ops acceptance
# comparison (`acceptance_ondemand.yml`). Two commit statuses show on the PR:
#   1. `PyTorch XPU: dispatch acceptance run` - this repo dispatched the run
#   2. `PyTorch XPU: oneDNN acceptance tests` - the run in the other repo
# Status #2 is finalized cross-repo by the acceptance run posting a commit
# status back (target_url links straight to that run). Event-driven, no polling.
#
# Command syntax (comment on the PR):
#   make test_pt[_ut|_e2e|_smoke] [key=value ...]
#     scope     : test_pt (UT+E2E) | test_pt_ut (UT only) | test_pt_e2e (E2E only) | test_pt_smoke (smoke only)
#     overrides : python= pytorch= torch_xpu_ops= target= baseline=
#   default to the PR head/base. Examples:
#     make test_pt
#     make test_pt_ut python=3.12
#     make test_pt_e2e target=<sha> baseline=<sha>
#     make test_pt_smoke

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: onednn-test-pt-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  XPU_OPS_REPO: intel/torch-xpu-ops
  XPU_OPS_WORKFLOW: acceptance_ondemand.yml
  XPU_OPS_REF: main
  DISPATCH_CONTEXT: 'PyTorch XPU: dispatch acceptance run'
  ACCEPT_CONTEXT: 'PyTorch XPU: oneDNN acceptance tests'

jobs:
  onednn_test_pt:
    name: onednn_test_pt
    if: >-
      github.repository_owner == 'uxlfoundation' &&
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      startsWith(github.event.comment.body, 'make test_pt')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Acknowledge command
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=rocket || true

      - name: Parse command
        id: cmd
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = (process.env.COMMENT_BODY || '').trim();
            // Syntax: make test_pt[_ut|_e2e|_smoke] [key=value ...]
            const m = body.match(/^make\s+(test_pt(?:_ut|_e2e|_smoke)?)\b([\s\S]*)$/i);
            if (!m) { core.setOutput('run', 'false'); return; }
            const pattern = m[1].toLowerCase(); // test_pt | test_pt_ut | test_pt_e2e | test_pt_smoke
            const opts = {
              python: '3.10',
              pytorch: 'main',
              torch_xpu_ops: 'main',
              target: '',
              baseline: '',
            };
            for (const tok of m[2].trim().split(/\s+/).filter(Boolean)) {
              const kv = tok.match(/^([a-zA-Z_]+)=(.+)$/);
              if (kv && kv[1].toLowerCase() in opts) opts[kv[1].toLowerCase()] = kv[2];
            }
            core.setOutput('run', 'true');
            core.setOutput('pattern', pattern);
            for (const [k, v] of Object.entries(opts)) core.setOutput(k, v);

      - name: Set pending statuses
        id: check
        if: steps.cmd.outputs.run == 'true'
        env:
          PATTERN: ${{ steps.cmd.outputs.pattern }}
          TARGET_OVERRIDE: ${{ steps.cmd.outputs.target }}
          BASELINE_OVERRIDE: ${{ steps.cmd.outputs.baseline }}
          DISPATCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: actions/github-script@v7
        with:
          script: |
            const comp = 'onednn';
            const pattern = process.env.PATTERN;
            const { owner, repo } = context.repo;
            const pr = (await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.issue.number,
            })).data;
            const sha = pr.head.sha;
            const shortSha = (s) => s.slice(0, 7);
            const target = process.env.TARGET_OVERRIDE || shortSha(pr.head.sha);
            const baseline = process.env.BASELINE_OVERRIDE || shortSha(pr.base.sha);
            const dispatchUrl = process.env.DISPATCH_RUN_URL;
            const workflowUrl = `https://github.com/${process.env.XPU_OPS_REPO}/actions/workflows/${process.env.XPU_OPS_WORKFLOW}`;
            // #1 this-repo dispatch (marked success at the end of this job).
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, state: 'pending',
              context: process.env.DISPATCH_CONTEXT, target_url: dispatchUrl,
              description: `Dispatching ${comp} acceptance (${pattern})…`,
            });
            // #2 other-repo acceptance run (finalized cross-repo by that run).
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, state: 'pending',
              context: process.env.ACCEPT_CONTEXT, target_url: workflowUrl,
              description: `Queued ${comp} acceptance (${pattern}) in ${process.env.XPU_OPS_REPO}`,
            });
            core.setOutput('head_sha', sha);
            core.setOutput('component', comp);
            core.setOutput('pattern', pattern);
            core.setOutput('target_version', target);
            core.setOutput('baseline_version', baseline);

      - name: Dispatch acceptance workflow
        id: dispatch
        if: steps.cmd.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.ONEDNN_DISPATCH_TOKEN }}
          COMPONENT: ${{ steps.check.outputs.component }}
          PATTERN: ${{ steps.check.outputs.pattern }}
          PYVER: ${{ steps.cmd.outputs.python }}
          PYTORCH: ${{ steps.cmd.outputs.pytorch }}
          TXO: ${{ steps.cmd.outputs.torch_xpu_ops }}
          TARGET: ${{ steps.check.outputs.target_version }}
          BASELINE: ${{ steps.check.outputs.baseline_version }}
          CALLBACK_SHA: ${{ steps.check.outputs.head_sha }}
        run: |
          # Fire-and-forget: the acceptance run posts commit status #2 back to
          # this repo (see ACCEPT_CONTEXT) when it finishes.
          echo "since=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh workflow run "${XPU_OPS_WORKFLOW}" \
            --repo "${XPU_OPS_REPO}" \
            --ref "${XPU_OPS_REF}" \
            -f caller="onednn-pr-${PR_NUMBER}" \
            -f callback_repo="${{ github.repository }}" \
            -f callback_sha="${CALLBACK_SHA}" \
            -f callback_context="${ACCEPT_CONTEXT}" \
            -f test_pattern="${PATTERN}" \
            -f python="${PYVER}" \
            -f pytorch="${PYTORCH}" \
            -f torch_xpu_ops="${TXO}" \
            -f test_component="${COMPONENT}" \
            -f target_version="${TARGET}" \
            -f baseline_version="${BASELINE}"

      - name: Locate dispatched run
        id: locate
        if: steps.cmd.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ONEDNN_DISPATCH_TOKEN }}
          SINCE: ${{ steps.dispatch.outputs.since }}
        run: |
          # One-shot lookup (with brief retry) for the run URL of the job we just
          # dispatched in the other repo — matched by our caller id so a
          # concurrent PR's dispatch is never mistaken for ours.
          url=""
          for _ in $(seq 1 10); do
            url=$(gh run list --repo "${XPU_OPS_REPO}" --workflow "${XPU_OPS_WORKFLOW}" \
              --event workflow_dispatch --created ">=${SINCE}" \
              --limit 20 --json url,name \
              --jq "[.[] | select((.name // \"\") | test(\"caller:onednn-pr-${PR_NUMBER}$\"))] | .[0].url // empty" 2>/dev/null || true)
            [ -n "$url" ] && break
            sleep 3
          done
          echo "run_url=${url}" >> "$GITHUB_OUTPUT"

      - name: Finalize dispatch status
        if: steps.cmd.outputs.run == 'true'
        env:
          RUN_URL: ${{ steps.locate.outputs.run_url }}
          HEAD_SHA: ${{ steps.check.outputs.head_sha }}
          COMPONENT: ${{ steps.check.outputs.component }}
          PATTERN: ${{ steps.check.outputs.pattern }}
          DISPATCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = process.env.HEAD_SHA;
            const comp = process.env.COMPONENT, pattern = process.env.PATTERN;
            const runUrl = process.env.RUN_URL;
            // #1 dispatch done.
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, state: 'success',
              context: process.env.DISPATCH_CONTEXT,
              target_url: process.env.DISPATCH_RUN_URL,
              description: `Dispatched ${comp} acceptance (${pattern}).`,
            });
            // #2 point at the actual run while it executes (stays pending).
            if (runUrl) {
              await github.rest.repos.createCommitStatus({
                owner, repo, sha, state: 'pending',
                context: process.env.ACCEPT_CONTEXT, target_url: runUrl,
                description: `Running ${comp} acceptance (${pattern}) in ${process.env.XPU_OPS_REPO}`,
              });
            }

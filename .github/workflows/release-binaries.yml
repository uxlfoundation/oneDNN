# Builds oneDNN binary packages for a release tag and attaches them, together
# with SHA256 checksums and build provenance attestations, to the GitHub
# release.

name: "Release Binaries"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example, v3.14)"
        required: true
        type: string
      upload:
        description: "Upload packages to the GitHub release for the tag"
        required: false
        type: boolean
        default: false

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate release tag
        id: tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Unexpected release tag format: '$RELEASE_TAG'"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  # manylinux_2_28 container ensures compatibility with RHEL 8 baseline.
  linux:
    name: Linux x64, ${{ matrix.config.name }}
    needs: prepare
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: omp, cpu_runtime: OMP, gpu_runtime: NONE, compiler: gcc }
          - { name: sycl, cpu_runtime: OMP, gpu_runtime: SYCL, compiler: icx }
    defaults:
      run:
        shell: bash
    env:
      COMPILER: ${{ matrix.config.compiler }}
      CPU_RUNTIME: ${{ matrix.config.cpu_runtime }}
      GPU_RUNTIME: ${{ matrix.config.gpu_runtime }}
      PKG_NAME: onednn-${{ needs.prepare.outputs.tag }}-${{ matrix.config.name }}-linux-x64
    steps:
      # Build scripts come from the workflow's own commit, so that older tags
      # without them can be built too.
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: .github/automation/release
          persist-credentials: false

      - name: Checkout oneDNN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: oneDNN
          persist-credentials: false

      - name: Install build tools
        run: pipx install ninja

      - name: Install Intel oneAPI DPC++/C++ Compiler
        if: matrix.config.compiler == 'icx'
        run: ci/.github/automation/release/install_dpcpp.sh

      - name: Build and test
        working-directory: oneDNN
        # The workspace is owned by a different user than the container one.
        # Mark it as safe so that CMake can record the commit hash.
        run: |
          git config --global --add safe.directory "$PWD"
          ../ci/.github/automation/release/build.sh "$GITHUB_WORKSPACE/$PKG_NAME"

      - name: Package
        run: tar -czf "$PKG_NAME.tar.gz" "$PKG_NAME"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-linux-${{ matrix.config.name }}
          path: ${{ env.PKG_NAME }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64, ${{ matrix.config.name }}
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: omp, cpu_runtime: OMP, gpu_runtime: NONE, compiler: cl }
          - { name: sycl, cpu_runtime: OMP, gpu_runtime: SYCL, compiler: icx }
    env:
      CPU_RUNTIME: ${{ matrix.config.cpu_runtime }}
      GPU_RUNTIME: ${{ matrix.config.gpu_runtime }}
      COMPILER: ${{ matrix.config.compiler }}
      PKG_NAME: onednn-${{ needs.prepare.outputs.tag }}-${{ matrix.config.name }}-windows-x64
    steps:
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          sparse-checkout: .github/automation/release
          persist-credentials: false

      - name: Checkout oneDNN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: oneDNN
          persist-credentials: false

      - name: Install Intel oneAPI DPC++/C++ Compiler
        if: matrix.config.compiler == 'icx'
        shell: cmd
        run: call ci\.github\automation\release\install_dpcpp.bat

      - name: Build and test
        shell: cmd
        working-directory: oneDNN
        run: call ..\ci\.github\automation\release\build.bat "%GITHUB_WORKSPACE%\%PKG_NAME%"

      - name: Package
        shell: pwsh
        run: 7z a -tzip "$env:PKG_NAME.zip" "$env:PKG_NAME"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-windows-${{ matrix.config.name }}
          path: ${{ env.PKG_NAME }}.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, linux, windows]
    if: github.event_name == 'release' || inputs.upload
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload release assets
      id-token: write # sign attestations
      attestations: write # store attestations
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum onednn-* > "onednn-$RELEASE_TAG-sha256sums.txt"
          cat "onednn-$RELEASE_TAG-sha256sums.txt"

      # Provenance describes the workflow run's own ref, so it is only accurate
      # when the run was started from the tag being released.
      - name: Attest build provenance
        if: github.ref == format('refs/tags/{0}', env.RELEASE_TAG)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/onednn-*

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/onednn-* --repo "$GITHUB_REPOSITORY" --clobber
